    <!-- Audio for Link Hover -->
    <script>
      // Play audio on link hover with autoplay policy handling
      const hoverAudio = document.getElementById('link-hover-audio');
      let audioEnabled = false;
      
      // Enable audio after first user interaction
      function enableAudio() {
        if (!audioEnabled) {
          hoverAudio.play().then(() => {
            hoverAudio.pause();
            hoverAudio.currentTime = 0;
            audioEnabled = true;
          }).catch(() => {
            // Audio still blocked, will try again on next interaction
          });
        }
      }
      
      // Listen for any user interaction to enable audio
      ['click', 'touchstart', 'keydown'].forEach(event => {
        document.addEventListener(event, enableAudio, { once: true });
      });
      
      document.querySelectorAll('a').forEach(link => {
        link.addEventListener('mouseenter', () => {
          if (audioEnabled) {
            hoverAudio.currentTime = 0;
            hoverAudio.play().catch(() => {
              // Silently handle any play errors
            });
          }
        });
      });
    </script>
